openapi: 3.0.3
info:
  title: Payments API
  version: 0.1.0
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            merchants:read: The caller's merchant profile
            merchants:manage: Create or update the caller's merchant profile
            merchants:read-all: Every merchant account
            merchants:suspend: Suspend a merchant account
            payment-requests:read: The caller's payment requests
            payment-requests:manage: Create payment requests
            transactions:read: The caller's transactions
            transactions:read-all: Every transaction across merchants
            transactions:refund: Refund a transaction
            payouts:read: The caller's payouts
            payouts:manage: Request an on-demand payout
            payouts:read-all: Every payout across merchants
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Merchant:
      type: object
      required: [id, businessName, email, status]
      properties:
        id: { type: string }
        businessName: { type: string }
        email: { type: string }
        phone: { type: string }
        payoutDestinationType: { type: string, enum: [bank, mobile-wallet] }
        payoutDestinationRef: { type: string, description: account or wallet number }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
    MerchantInput:
      type: object
      required: [businessName, email]
      properties:
        businessName: { type: string }
        email: { type: string }
        phone: { type: string }
        payoutDestinationType: { type: string, enum: [bank, mobile-wallet] }
        payoutDestinationRef: { type: string }
    PaymentRequest:
      type: object
      required: [id, amount, currency, status]
      properties:
        id: { type: string }
        merchantId: { type: string }
        amount: { type: number, format: double }
        currency: { type: string, default: KES }
        description: { type: string }
        status: { type: string, enum: [pending, paid, expired] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    PaymentRequestInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number, format: double }
        description: { type: string }
    Transaction:
      type: object
      required: [id, paymentRequestId, channel, amount, currency, status]
      properties:
        id: { type: string }
        paymentRequestId: { type: string }
        merchantId: { type: string }
        channel: { type: string, enum: [mobile-money, card] }
        amount: { type: number, format: double }
        currency: { type: string, default: KES }
        payerContact: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        providerReference: { type: string }
        paidAt: { type: string, format: date-time }
    TransactionInput:
      type: object
      required: [channel, payerContact]
      properties:
        channel: { type: string, enum: [mobile-money, card] }
        payerContact: { type: string, description: phone number or card token }
    Refund:
      type: object
      required: [id, transactionId, amount, status]
      properties:
        id: { type: string }
        transactionId: { type: string }
        amount: { type: number, format: double }
        reason: { type: string }
        status: { type: string, enum: [pending, completed, failed] }
        createdAt: { type: string, format: date-time }
    RefundInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number, format: double }
        reason: { type: string }
    Balance:
      type: object
      required: [merchantId, availableAmount, currency]
      properties:
        merchantId: { type: string }
        availableAmount: { type: number, format: double }
        currency: { type: string, default: KES }
    Payout:
      type: object
      required: [id, merchantId, amount, status]
      properties:
        id: { type: string }
        merchantId: { type: string }
        amount: { type: number, format: double }
        currency: { type: string, default: KES }
        destinationType: { type: string, enum: [bank, mobile-wallet] }
        status: { type: string, enum: [pending, completed, failed] }
        providerReference: { type: string }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
security:
  - oauth2: []
paths:
  /me/merchant:
    get:
      operationId: getMyMerchant
      summary: The caller's merchant profile
      security:
        - oauth2: [merchants:read]
      responses:
        '200':
          description: The merchant profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '404':
          description: No merchant profile yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateMyMerchant
      summary: Create or update the caller's merchant profile
      security:
        - oauth2: [merchants:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantInput' }
      responses:
        '200':
          description: Updated merchant profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /merchants:
    get:
      operationId: listMerchants
      summary: Every merchant account
      security:
        - oauth2: [merchants:read-all]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Page of merchants
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Merchant' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not permitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
